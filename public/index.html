<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon TicTacToe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(20, 20, 30, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #00f2ff;
            --secondary: #ff0055;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --grid-gap: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 242, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 85, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* --- THE FIX IS HERE --- */
        /* Scanline effect */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none; /* critical: allow clicks to pass through */
            z-index: -1; /* keep it behind page content */
        }

        .game-container {
            width: 100%;
            max-width: 520px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 20px;

            position: relative;
            z-index: 1; /* ensure inputs live above pseudo elements */
        }

        /* make inputs reliably clickable above visual layers */
        .controls input, .controls .input-group {
            position: relative;
            z-index: 2;
        }

        /* Music button shouldn't cover inputs on small screens */
        @media (max-width: 500px) {
            .music-toggle { bottom: 16px; right: 16px; top: auto; }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #fff 0%, #b0b0b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255,255,255,0.1);
        }

        .subtitle { color: var(--text-muted); font-size: 0.9rem; font-weight: 400; letter-spacing: 0.5px; }

        .status-bar {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #status { font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #555; transition: 0.3s; }
        .status-dot.active { background-color: var(--primary); box-shadow: 0 0 10px var(--primary); }
        .status-dot.waiting { background-color: #ffcc00; box-shadow: 0 0 10px #ffcc00; }
        .status-dot.error { background-color: var(--secondary); box-shadow: 0 0 10px var(--secondary); }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        input {
            width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--glass-border);
            color: #fff; padding: 14px 16px; border-radius: 12px; font-size: 1rem; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0, 242, 255, 0.1); }

        .btn {
            border: none; padding: 14px; border-radius: 12px; font-size: 0.95rem; font-weight: 700;
            text-transform: uppercase; cursor: pointer; transition: 0.3s ease; color: #fff;
        }

        #join-btn {
            grid-column: span 2;
            background: linear-gradient(135deg, rgba(0, 242, 255, 0.8), rgba(0, 180, 255, 0.6));
            border: 1px solid var(--primary);
            box-shadow: 0 4px 15px rgba(0, 242, 255, 0.2);
        }
        #join-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 242, 255, 0.4); }

        #copy-btn {
            grid-column: span 2; display: none; /* Hidden until joined */
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #copy-btn:hover { background: rgba(255, 255, 255, 0.15); }

        #board {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--grid-gap);
            margin: 10px auto; width: 100%; aspect-ratio: 1; padding: 10px;
            border-radius: 16px; transition: box-shadow 0.3s ease;
        }
        #board.my-turn-active { box-shadow: inset 0 0 30px rgba(0, 242, 255, 0.15), 0 0 20px rgba(0, 242, 255, 0.1); border: 1px solid rgba(0, 242, 255, 0.3); }

        .cell {
            background: rgba(255, 255, 255, 0.03); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 4rem; font-weight: 700; cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
        }
        .cell:hover:empty { background: rgba(255, 255, 255, 0.08); transform: scale(0.96); }
        .cell.x { color: var(--primary); text-shadow: 0 0 20px var(--primary); }
        .cell.o { color: var(--secondary); text-shadow: 0 0 20px var(--secondary); }

        /* WINNING ANIMATION */
        .cell.win-highlight {
            animation: pulse-win 1s infinite alternate;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid #fff;
        }

        @keyframes pulse-win {
            from { box-shadow: 0 0 10px currentColor; transform: scale(1); }
            to { box-shadow: 0 0 30px currentColor, 0 0 60px currentColor; transform: scale(1.05); }
        }

        #error { color: var(--secondary); text-align: center; font-size: 0.9rem; min-height: 20px; font-weight: 600; }
        .meta-info { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.05); }

        /* --- Chat UI styling (Cyberpunk Terminal) --- */
        .chat-container {
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 260px;
        }
        /* Emoji bar */
        .emoji-bar {
            display:flex;
            gap:8px;
            align-items:center;
            padding-bottom:4px;
        }
        .emoji-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.04);
            color: var(--text-main);
            padding:6px 8px;
            border-radius:10px;
            font-size:1.2rem;
            cursor:pointer;
            transition: box-shadow 0.18s ease, transform 0.12s ease;
        }
        .emoji-btn:hover {
            box-shadow: 0 6px 18px rgba(0,242,255,0.08), 0 0 12px rgba(0,242,255,0.06);
            transform: translateY(-3px);
        }

        /* Floating reaction */
        .reaction {
            position: absolute;
            bottom: 20px;
            pointer-events: none;
            font-size: 28px;
            will-change: transform, opacity;
            text-shadow: 0 0 14px rgba(0,242,255,0.12);
            animation: float-up-fade 2600ms cubic-bezier(.2,.9,.2,1) forwards;
        }
        @keyframes float-up-fade {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            60% { transform: translateY(-120px) scale(1.15); opacity: 0.9; }
            100% { transform: translateY(-220px) scale(1.25); opacity: 0; }
        }

        #error { color: var(--secondary); text-align: center; font-size: 0.9rem; min-height: 20px; font-weight: 600; }
        .meta-info { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.05); }

        /* --- Chat UI styling (Cyberpunk Terminal) --- */
        .chat-container {
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 260px;
        }
        .chat-history {
            background: rgba(0,0,0,0.12);
            border-radius: 8px;
            padding: 8px;
            overflow-y: auto;
            display:flex;
            flex-direction: column;
            gap: 6px;
            max-height: 160px;
        }
        .chat-meta { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 4px; }
        .chat-msg { padding: 8px 12px; border-radius: 12px; max-width: 78%; word-break: break-word; font-size: 0.95rem; }
        .chat-msg.me { align-self: flex-end; background: linear-gradient(135deg, var(--primary), rgba(0,180,255,0.6)); color: #001; box-shadow: 0 6px 18px rgba(0,242,255,0.06); }
        .chat-msg.other { align-self: flex-start; background: rgba(255,255,255,0.03); color: var(--text-main); border: 1px solid rgba(255,255,255,0.03); }
        .chat-msg.system { align-self: center; background: transparent; color: var(--text-muted); font-style: italic; max-width: 100%; }
        .chat-input { display:flex; gap:8px; }
        .chat-input input { flex:1; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.04); background: rgba(0,0,0,0.35); color: var(--text-main); }
        .chat-input button { padding: 10px 12px; border-radius:10px; border:none; background: linear-gradient(135deg, var(--primary), rgba(0,180,255,0.6)); color:#001; font-weight:700; cursor:pointer; }
        .chat-sender { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }

        @media (max-width: 500px) {
            .game-container { padding: 20px; }
            .controls { grid-template-columns: 1fr; }
            #join-btn, #copy-btn { grid-column: span 1; }
            .cell { font-size: 3rem; }
            .chat-history { max-height: 130px; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="music-toggle" id="music-btn" title="Toggle Ambient Drone">🎵</div>

        <div class="header">
            <h1>Neon Tac Toe</h1>
            <p class="subtitle">Multiplayer Cyberpunk Battle</p>
        </div>

        <div class="controls" id="login-controls">
            <div class="input-group">
                <input type="text" id="room-input" placeholder="Room Code (e.g. ab12)" maxlength="30" autocomplete="off" aria-label="Room code">
            </div>
            <div class="input-group">
                <input type="password" id="password-input" placeholder="Password (optional)" maxlength="30" autocomplete="current-password" aria-label="Room password">
            </div>
            <!-- New Player Name input -->
            <div class="input-group" style="grid-column: span 2;">
                <input type="text" id="name-input" placeholder="Enter Alias (e.g. Neo)" maxlength="30" autocomplete="nickname" aria-label="Player name">
            </div>
            <button id="join-btn" class="btn">Join / Create Room</button>
        </div>
        
        <button id="copy-btn" class="btn">📋 Copy Room Code</button>

        <div id="error"></div>

        <div class="status-bar">
            <div id="status" aria-live="polite"><span class="status-dot" id="status-dot"></span> <span id="status-text">Idle</span></div>
        </div>

        <div id="board" role="grid" aria-label="Tic Tac Toe board"></div>

        <!-- Chat: Cyberpunk Terminal -->
        <div class="chat-container" id="chat-container" aria-live="polite">
            <div class="emoji-bar" id="emoji-bar" aria-hidden="false">
                <button class="emoji-btn">🔥</button>
                <button class="emoji-btn">😂</button>
                <button class="emoji-btn">😲</button>
                <button class="emoji-btn">😎</button>
                <button class="emoji-btn">💀</button>
                <button class="emoji-btn">💩</button>
            </div>
             <div class="chat-history" id="chat-history" role="log" aria-atomic="false"></div>
             <div class="chat-input">
                 <input id="chat-input" type="text" placeholder="Trash talk or gg..." maxlength="250" aria-label="Chat input">
                 <button id="chat-send">Send</button>
             </div>
         </div>

        <div class="meta-info">
            <div id="player-info">Not in a room</div>
            <div id="players-count">Players: 0/2</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        // Reactions helpers
        const emojiBar = document.getElementById("emoji-bar");
        const gameContainer = document.querySelector(".game-container");

        function spawnFloatingEmoji(emoji) {
            const el = document.createElement("div");
            el.className = "reaction";
            el.textContent = emoji;
            // random horizontal position within game container
            const rect = gameContainer.getBoundingClientRect();
            const padding = 24;
            const left = Math.max(padding, Math.random() * (rect.width - padding * 2));
            el.style.left = `${left}px`;
            gameContainer.appendChild(el);
            // remove after animation completes
            setTimeout(() => { try { el.remove(); } catch (e) {} }, 2800);
        }

        // --- DOM Elements ---
        const boardEl = document.getElementById("board");
        const statusTextEl = document.getElementById("status-text");
        const statusDotEl = document.getElementById("status-dot");
        const errorEl = document.getElementById("error");
        const playerInfoEl = document.getElementById("player-info");
        const playersCountEl = document.getElementById("players-count");
        const roomInput = document.getElementById("room-input");
        const passwordInput = document.getElementById("password-input");
        const nameInput = document.getElementById("name-input"); // new
        const joinBtn = document.getElementById("join-btn");
        const copyBtn = document.getElementById("copy-btn");
        const loginControls = document.getElementById("login-controls");
        const musicBtn = document.getElementById("music-btn");

        // Chat elements
        const chatHistoryEl = document.getElementById("chat-history");
        const chatInput = document.getElementById("chat-input");
        const chatSendBtn = document.getElementById("chat-send");

        let roomId = null;
        let mySymbol = null;
        let currentTurn = "X";
        let isMyTurn = false;
        let isGameActive = false;
        let myName = null; // store local player name

        // focus input for convenience
        try { roomInput.focus(); } catch (e) {}

        // build 3x3 board (simple safe init)
        const cells = [];
        for (let i = 0; i < 9; i++) {
            const c = document.createElement("div");
            c.className = "cell";
            c.dataset.index = i;
            c.tabIndex = 0;
            c.setAttribute("role", "button");
            c.addEventListener("click", () => handleCellClick(i));
            c.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); handleCellClick(i); }});
            boardEl.appendChild(c);
            cells.push(c);
        }

        function showError(msg) {
            errorEl.textContent = msg;
            statusTextEl.textContent = "Error";
            statusDotEl.className = "status-dot error";
            setTimeout(() => { errorEl.textContent = ""; statusTextEl.textContent = "Idle"; statusDotEl.className = "status-dot"; }, 3500);
        }

        joinBtn.addEventListener("click", () => {
            const r = (roomInput.value || "").trim();
            const p = (passwordInput.value || "").trim();
            const n = (nameInput.value || "").trim() || "Anonymous";
            if (!r || r.length < 3) return showError("Enter a room code (min 3 chars).");

            roomId = r;
            myName = n;
            joinBtn.disabled = true;
            joinBtn.textContent = "Connecting...";
            if (audioCtx.state === 'suspended') audioCtx.resume();

            // send playerName to server
            socket.emit("joinRoom", { roomId: r, password: p, playerName: n });
        });

        copyBtn.addEventListener("click", () => {
            if (!roomId) return showError("No joined room to copy.");
            navigator.clipboard?.writeText(roomId).then(() => {
                copyBtn.textContent = "Copied ✅";
                setTimeout(() => copyBtn.textContent = "📋 Copy Room Code", 1500);
            }).catch(() => showError("Copy failed."));
        });

        socket.on("roomError", (msg) => {
            roomId = null;
            joinBtn.disabled = false;
            joinBtn.textContent = "Join / Create Room";
            showError(msg);
        });

        socket.on("roomJoined", (joinedRoomId) => {
            // server may normalize room id (lowercase) — trust it
            if (joinedRoomId) roomId = joinedRoomId;
            loginControls.style.display = "none";
            copyBtn.style.display = "inline-block";
            copyBtn.disabled = false;
            roomInput.value = roomId;
            roomInput.setAttribute("disabled", "true");
            passwordInput.setAttribute("disabled", "true");
            nameInput.setAttribute("disabled", "true");
            statusTextEl.textContent = `Joined ${roomId}`;
            statusDotEl.className = "status-dot active";
        });

        socket.on("init", (data) => {
            // minimal safe handling here; rest of logic can reuse existing functions
            mySymbol = data.symbol ?? null;
            currentTurn = data.turn ?? "X";
            playersCountEl.textContent = `Players: ${data.playersCount}/2`;
            playerInfoEl.textContent = mySymbol ? `You are: ${mySymbol}` : "Spectator";
            // update board if provided
            if (Array.isArray(data.board)) {
                data.board.forEach((val, i) => {
                    cells[i].textContent = val || "";
                    cells[i].classList.remove("x","o");
                    if (val === "X") cells[i].classList.add("x");
                    if (val === "O") cells[i].classList.add("o");
                });
            }
        });

        function handleCellClick(index) {
            if (!roomId) return showError("Join a room first.");
            if (!mySymbol) return showError("You're a spectator.");
            if (!isGameActive) return showError("Game not active.");
            if (currentTurn !== mySymbol) return showError("Not your turn.");
            if (cells[index].textContent) return;

            socket.emit("makeMove", { roomId, index, symbol: mySymbol });
        }

        // lightweight moveMade handler to show symbol and winning line
        socket.on("moveMade", ({ index, symbol, turn, winner, winningLine, isDraw }) => {
            cells[index].textContent = symbol;
            cells[index].classList.add(symbol === "X" ? "x" : "o");
            currentTurn = turn;
            isGameActive = !winner && !isDraw;
            if (winner && Array.isArray(winningLine)) {
                winningLine.forEach(i => cells[i].classList.add("win-highlight"));
                // small confetti trigger if client sees they won
                if (winner === mySymbol) {
                    try { confetti({ particleCount: 60, spread: 50 }); } catch (e) {}
                }
            }
        });

        socket.on("resetBoard", () => {
            cells.forEach(c => { c.textContent = ""; c.classList.remove("x","o","win-highlight"); });
            isGameActive = true;
        });

        // CHAT: Send message
        function appendChat({ senderName, message, symbol }) {
            const wrapper = document.createElement("div");
            // system messages
            if (senderName === "System") {
                const el = document.createElement("div");
                el.className = "chat-msg system";
                el.textContent = message;
                wrapper.appendChild(el);
            } else {
                const nameEl = document.createElement("div");
                nameEl.className = "chat-sender";
                nameEl.textContent = senderName + (symbol ? ` · ${symbol}` : "");
                wrapper.appendChild(nameEl);

                const msgEl = document.createElement("div");
                const isMe = (myName && senderName === myName);
                msgEl.className = "chat-msg " + (isMe ? "me" : "other");
                msgEl.textContent = message;
                wrapper.appendChild(msgEl);
            }
            chatHistoryEl.appendChild(wrapper);
            // auto-scroll
            chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
        }

        chatSendBtn.addEventListener("click", () => {
            const txt = (chatInput.value || "").trim();
            if (!txt) return;
            if (!roomId) return showError("Join a room first.");
            // emit chat message (server will attach senderName + symbol)
            socket.emit("chatMessage", { roomId, message: txt });
            chatInput.value = "";
        });

        chatInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                chatSendBtn.click();
            }
        });

        // receive chat messages (from peers or system)
        socket.on("chatMessage", ({ senderName, message, symbol }) => {
            appendChat({ senderName, message, symbol });
        });

        // maintain players count updates
        socket.on("playersCount", (count) => {
            playersCountEl.textContent = `Players: ${count}/2`;
        });

        // emoji click -> emit sendReaction
        emojiBar?.addEventListener("click", (e) => {
            const btn = e.target.closest?.(".emoji-btn");
            if (!btn || !roomId) return;
            const emoji = btn.textContent.trim();
            if (!emoji) return;
            socket.emit("sendReaction", { roomId, emoji });
        });

        // receive reaction from server and show floating emoji
        socket.on("playerReaction", ({ emoji, senderId }) => {
            spawnFloatingEmoji(emoji);
        });
    </script>
</body>
</html>
