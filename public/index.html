<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon TicTacToe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <!-- Dynamic Cyberpunk Grid / Particle Background -->
    <canvas id="bg-canvas"></canvas>

    <div id="rematch-modal" class="modal-overlay">
        <div class="modal-content glass-panel">
            <h2>Run it Back?</h2>
            <p>Opponent wants a rematch.</p>
            <div class="modal-actions">
                <button id="accept-rematch-btn" class="btn primary-btn">Accept</button>
                <button id="decline-rematch-btn" class="btn secondary-btn">Decline</button>
            </div>
        </div>
    </div>

    <!-- Wrapping container for 3D tilt effect if desired, or we tilt the board only -->
    <div class="main-wrapper" id="main-wrapper">
        <div class="game-container glass-panel">
            <button class="music-toggle" id="music-btn" title="Toggle Sound UX effects">🔊</button>

            <div class="header">
                <h1 class="glitch" data-text="Neon Tac Toe">Neon Tac Toe</h1>
                <p class="subtitle">Multiplayer Cyberpunk Battle</p>
            </div>

            <div class="controls" id="login-controls">
                <div class="input-group">
                    <input type="text" id="room-input" placeholder="Room Code (min 3 chars)" maxlength="30" autocomplete="off">
                    <div class="input-glow"></div>
                </div>
                <div class="input-group">
                    <input type="password" id="password-input" placeholder="Password (opt)" maxlength="30">
                    <div class="input-glow"></div>
                </div>
                <div class="input-group full-width">
                    <input type="text" id="name-input" placeholder="Enter Alias (e.g. Neo)" maxlength="30">
                    <div class="input-glow"></div>
                </div>
                <button id="join-btn" class="btn primary-btn full-width neon-pulse">Initialize Link</button>
            </div>
            
            <div class="game-buttons">
                <button id="copy-btn" class="btn outline-btn" style="display:none;">📋 Copy Code</button>
                <button id="rematch-btn" class="btn outline-btn" style="display:none;">🔄 Request Rematch</button>
            </div>

            <div id="error" class="error-msg"></div>

            <div class="status-bar glass-panel-inner">
                <div id="status" aria-live="polite">
                    <div class="status-indicator">
                        <span class="status-dot" id="status-dot"></span>
                        <span class="status-ring"></span>
                    </div>
                    <span id="status-text">System Idle</span>
                </div>
            </div>

            <div class="game-content">
                <!-- 3D Board Wrapper -->
                <div class="board-wrapper perspective-container">
                    <div id="board" role="grid" class="board-3d"></div>
                    <!-- New Result Overlay -->
                    <div id="result-overlay" class="result-overlay hidden">
                        <h2 id="result-text" class="glitch"></h2>
                    </div>
                </div>

                <div class="chat-container glass-panel-inner" id="chat-container">
                    <div class="emoji-bar" id="emoji-bar">
                        <button class="emoji-btn">🔥</button>
                        <button class="emoji-btn">😂</button>
                        <button class="emoji-btn">😲</button>
                        <button class="emoji-btn">👾</button>
                        <button class="emoji-btn">💀</button>
                        <button class="emoji-btn">⚡</button>
                    </div>
                     <div class="chat-history scrollbar-hidden" id="chat-history"></div>
                     <div class="chat-input-wrapper">
                         <input id="chat-input" type="text" placeholder="Transmit message..." maxlength="250">
                         <button id="chat-send" class="btn primary-btn small-btn">►</button>
                     </div>
                 </div>
            </div>

            <div class="meta-info">
                <div id="player-info">Not Connected</div>
                <div id="players-count"><span class="icon">👥</span> 0/2 Offline</div>
            </div>
        </div>
    </div>

    <!-- SVGs for injection hidden -->
    <svg style="display: none;">
        <symbol id="icon-x" viewBox="0 0 100 100">
            <path class="neon-path neon-x" d="M 20 20 L 80 80 M 80 20 L 20 80" stroke-linecap="round"/>
        </symbol>
        <symbol id="icon-o" viewBox="0 0 100 100">
            <circle class="neon-path neon-o" cx="50" cy="50" r="35" stroke-linecap="round"/>
        </symbol>
    </svg>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
